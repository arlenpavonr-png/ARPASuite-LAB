<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARPASuite NEXT — Modo Técnico</title><style>body{margin:0;background:#f4f6f9;color:#172033;font:16px system-ui}.app{max-width:680px;margin:auto}.top{background:#0f2044;color:#fff;padding:18px;position:sticky;top:0}.next{color:#f59e0b}.wrap{padding:12px}.card{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:16px;margin-bottom:12px}.muted{color:#687386;font-size:13px}.btn{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;width:100%;margin-top:8px}.blue{background:#2563eb;color:white}.gold{background:#fff0c7;color:#8a5200}.light{background:#edf2f7;color:#0f2044}.check{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px}.voice{font-size:18px;min-height:100px}.pill{display:inline-block;background:#eef3f9;border-radius:20px;padding:6px 9px;font-size:12px;margin:3px}.ok{background:#eaf7ee;color:#15803d}.warn{background:#fff5df;color:#9a5a00}</style><div class="app"><header class="top"><b>ARPA SUITE <span class="next">NEXT</span></b><div style="font-size:12px;margin-top:7px">● LAB · Modo Técnico</div></header><main class="wrap"><div class="card"><b>Servicio de hoy</b><h2 id="client">Selecciona un equipo</h2><div id="asset" class="muted">El técnico solo necesita escoger el trabajo.</div></div><div class="card"><b>¿Qué vas a hacer?</b><button class="btn blue" onclick="start('Mantenimiento')">🔧 Mantenimiento</button><button class="btn light" onclick="start('Reparación')">🛠 Reparación</button><button class="btn light" onclick="start('Diagnóstico')">🔎 Diagnóstico</button></div><div id="work" style="display:none"><div class="card"><b>Revisión rápida</b><div id="checks"></div></div><div class="card"><b>📷 Evidencia</b><input id="photos" type="file" accept="image/*" multiple style="margin-top:10px"><div id="photoCount" class="muted" style="margin-top:7px">Sin fotos seleccionadas.</div></div><div class="card"><b>🎙 Cuéntame qué encontraste</b><textarea id="voiceText" class="voice" placeholder="Pulsa el micrófono y habla. No necesitas escribir."></textarea><button id="mic" class="btn gold" onclick="listen()">🎙 Hablar</button><div id="ai" class="muted" style="margin-top:10px">La IA convertirá tu relato en información organizada.</div></div><button class="btn blue" onclick="finish()">✓ Finalizar servicio</button></div><div id="done" class="card" style="display:none"><b>✅ Servicio preparado</b><div id="summary" class="muted" style="margin-top:8px"></div><button class="btn light" onclick="location.reload()">Nuevo servicio</button></div></main></div><script>const items=['Estado mecánico','Cremallera y piñón','Finales de carrera','Fotoceldas / sensores','Tarjeta electrónica','Alimentación eléctrica','Controles remotos','Lubricación','Prueba de apertura y cierre'];let type='';function start(t){type=t;document.getElementById('work').style.display='block';document.getElementById('client').textContent='Cliente de prueba';document.getElementById('asset').textContent='BFT Deimos A600 · Motor corredizo';document.getElementById('checks').innerHTML=items.map(x=>'<label class="check"><input type="checkbox">'+x+'</label>').join('');scrollTo(0,0)}document.getElementById('photos').onchange=e=>{let n=e.target.files.length;document.getElementById('photoCount').textContent=n?n+' foto(s) seleccionada(s).':'Sin fotos seleccionadas.'};function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('El navegador no permite dictado por voz. Prueba Chrome.');return}const r=new SR();r.lang='es-CO';r.interimResults=false;r.onstart=()=>document.getElementById('mic').textContent='🔴 Escuchando...';r.onend=()=>document.getElementById('mic').textContent='🎙 Hablar';r.onresult=e=>{document.getElementById('voiceText').value+=(document.getElementById('voiceText').value?' ':'')+e.results[0][0].transcript};r.start()}function finish(){const done=[...document.querySelectorAll('#checks input')].filter(x=>x.checked).length;const n=document.getElementById('photos').files.length;const text=document.getElementById('voiceText').value.trim();document.getElementById('summary').innerHTML='<span class="pill">'+type+'</span> <span class="pill ok">'+done+'/'+items.length+' revisados</span> <span class="pill">📷 '+n+'</span><br><br><b>Relato del técnico:</b><br>'+esc(text||'Sin relato')+'<br><br><b>Siguiente:</b> IA organiza este relato, genera informe y propone próxima acción.';document.getElementById('work').style.display='none';document.getElementById('done').style.display='block'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></html>
