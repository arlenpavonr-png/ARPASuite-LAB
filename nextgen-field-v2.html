<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARPASuite NEXT · Técnico</title><style>body{margin:0;background:#f4f6f9;color:#172033;font:16px system-ui}.app{max-width:600px;margin:auto}.top{background:#0f2044;color:#fff;padding:18px;position:sticky;top:0}.top b{font-size:20px}.next{color:#f59e0b}.card{background:white;margin:12px;padding:16px;border-radius:16px;border:1px solid #dbe2ea}.muted{color:#687386;font-size:13px}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:16px;width:100%;margin-top:10px}.primary{background:#2563eb;color:#fff}.gold{background:#fff1d6;color:#8a5200}.ok{background:#eaf7ee;color:#176b36}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.check input{width:22px;height:22px}.photo{border:2px dashed #cbd5e1;padding:18px;text-align:center;border-radius:12px;margin-top:10px}.photo input{display:none}textarea,select,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;margin-top:6px}.voice{font-size:14px;background:#eef3f9;padding:12px;border-radius:10px;margin-top:8px}.result{display:none}.result.show{display:block}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef3f9;font-size:12px;margin:3px}</style><div class="app"><header class="top"><b>ARPA SUITE <span class="next">NEXT</span></b><div class="muted" style="color:#bbf7d0">● Modo técnico · LAB</div></header><main><section class="card"><div class="muted">SERVICIO</div><h2 style="margin:5px 0">Mantenimiento</h2><label>Cliente<select id="client"><option>Seleccionar cliente...</option><option>Cliente de prueba · Medellín</option><option>Edificio Los Alpes</option></select></label><label>Equipo<select id="asset"><option>BFT Deimos BT A600 · Puerta principal</option><option>Accessmatic Bulldozer 850</option></select></label></section><section class="card"><div class="muted">CHECKLIST RÁPIDO</div><div id="checks"></div><button class="btn secondary" onclick="checkAll()">✓ Marcar todo OK</button></section><section class="card"><div class="muted">EVIDENCIA</div><label class="photo">📷 Tomar / seleccionar fotos<input id="photos" type="file" accept="image/*" multiple onchange="photoInfo()"></label><div id="pi" class="muted"></div></section><section class="card"><div class="muted">CUÉNTAME QUÉ ENCONTRASTE</div><button class="btn gold" onclick="voice()">🎙 Hablar en vez de escribir</button><div id="voiceState" class="voice">Pulsa y habla normalmente. La transcripción aparecerá abajo.</div><textarea id="notes" rows="4" placeholder="También puedes escribir aquí..."></textarea></section><button class="btn primary" onclick="prepare()">✨ Preparar servicio con IA</button><section id="result" class="card result"><div class="muted">BORRADOR GENERADO</div><h2 id="rtitle"></h2><div id="rtags"></div><p id="rtext"></p><button class="btn ok" onclick="finish()">✓ Finalizar servicio</button></section></main></div><script>const items=['Estado mecánico','Cremallera y piñón','Finales de carrera','Fotoceldas / sensores','Tarjeta electrónica','Alimentación eléctrica','Controles remotos','Lubricación','Prueba de apertura y cierre'];const box=document.getElementById('checks');box.innerHTML=items.map((x,i)=>`<label class="check"><input type="checkbox" id="c${i}"> ${x}</label>`).join('');function checkAll(){items.forEach((_,i)=>document.getElementById('c'+i).checked=true)}function photoInfo(){const n=photos.files.length;pi.textContent=n?n+' foto(s) seleccionada(s).':'Sin fotos seleccionadas.'}function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){voiceState.textContent='El navegador no permite dictado aquí. Puedes escribir.';return}const r=new R();r.lang='es-CO';r.interimResults=false;r.onstart=()=>voiceState.textContent='🔴 Escuchando...';r.onresult=e=>{const t=e.results[0][0].transcript;notes.value+=(notes.value?' ':'')+t;voiceState.textContent='✓ Transcripción agregada.'};r.onerror=()=>voiceState.textContent='No pude escuchar. Intenta nuevamente.';r.onend=()=>{};r.start()}function prepare(){const done=items.filter((_,i)=>document.getElementById('c'+i).checked).length;const txt=notes.value.trim();rtitle.textContent='Resumen del servicio';rtags.innerHTML=`<span class="tag">Checklist ${done}/${items.length}</span><span class="tag">Fotos ${photos.files.length}</span><span class="tag">${asset.value}</span>`;rtext.textContent=txt||'Servicio registrado a partir del checklist. La IA deberá convertir los hallazgos en diagnóstico, trabajo realizado y recomendaciones cuando conectemos el motor de IA.';result.classList.add('show');result.scrollIntoView({behavior:'smooth'})}function finish(){alert('Servicio finalizado en modo LAB. En la siguiente fase se guardará en el historial y generará el informe automáticamente.')}</script></html>
