<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2044"><title>ARPASuite Next Gen — Campo</title>
<style>
:root{--navy:#0f2044;--blue:#2563eb;--gold:#d97706;--bg:#f4f6f9;--card:#fff;--text:#172033;--muted:#687386;--line:#dbe2ea;--green:#15803d;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:78px}.app{max-width:820px;margin:auto}.top{background:var(--navy);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.3px}.status{font-size:11px;color:#bbf7d0}.title{font-size:24px;font-weight:850;margin-top:14px}.sub{font-size:12px;color:#b9c8df;margin-top:3px}.content{padding:13px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;box-shadow:0 2px 8px #00000008}.section{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:10px;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:#fff;color:var(--text)}textarea{min-height:78px}.btn{border:0;border-radius:10px;padding:11px 13px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f7;color:var(--navy)}.danger{background:#fff0f0;color:var(--red)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer}.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:3px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{padding:5px 8px;border-radius:999px;background:#eef3f9;color:var(--muted);font-size:10px;font-weight:800}.chip.good{background:#eaf7ee;color:var(--green)}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric div{background:#f7f9fc;border-radius:10px;padding:10px}.metric b{display:block;font-size:20px}.metric span{font-size:9px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:18px;font-size:12px}.check{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}.check input{width:18px;height:18px;accent-color:var(--blue)}.photo{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}.photo input{display:none}.back{margin-bottom:8px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px;z-index:6}.nav{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:800;padding:6px}.nav button.active{color:var(--blue)}.notice{font-size:12px;color:var(--muted);line-height:1.45}.search{margin-bottom:9px}@media(max-width:480px){.grid,.actions{grid-template-columns:1fr}.full{grid-column:auto}.title{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topline"><div class="brand">ARPA SUITE <span style="color:var(--gold)">NEXT</span></div><div id="status" class="status">● LAB · local</div></div><div class="title" id="pageTitle">¿Qué necesitas hacer?</div><div class="sub">Cliente → equipo → servicio → historial</div></header>
<main class="content">
<section id="home" class="view active">
<div class="card"><div class="section">Resumen</div><div class="metric"><div><b id="mClients">0</b><span>CLIENTES</span></div><div><b id="mAssets">0</b><span>EQUIPOS</span></div><div><b id="mJobs">0</b><span>SERVICIOS</span></div></div></div>
<div class="card"><div class="section">Acciones rápidas</div><div class="actions"><button class="btn primary" onclick="openView('client')">+ Cliente</button><button class="btn secondary" onclick="openView('asset')">+ Equipo</button></div><div style="height:8px"></div><button class="btn primary" style="width:100%" onclick="openView('job')">🔧 Nuevo servicio</button></div>
<div class="card"><div class="section">Últimos movimientos</div><div id="recent" class="list"></div></div>
</section>
<section id="clients" class="view"><button class="btn secondary back" onclick="openView('home')">← Inicio</button><div class="card"><div class="section">Clientes</div><input class="search" id="clientSearch" placeholder="Buscar cliente..." oninput="renderClients()"><div id="clientList" class="list"></div></div></section>
<section id="client" class="view"><button class="btn secondary back" onclick="openView('clients')">← Clientes</button><div class="card"><div class="section">Nuevo cliente</div><div class="grid"><div class="field full"><label>Empresa / nombre</label><input id="cn" placeholder="Ej. Edificio Los Alpes"></div><div class="field"><label>Teléfono</label><input id="cp" inputmode="tel" placeholder="300 000 0000"></div><div class="field"><label>Ciudad</label><input id="cc" value="Medellín"></div><div class="field full"><label>Dirección</label><input id="ca"></div></div><div style="height:10px"></div><button class="btn primary" style="width:100%" onclick="saveClient()">Guardar cliente</button></div></section>
<section id="clientDetail" class="view"><button class="btn secondary back" onclick="openView('clients')">← Clientes</button><div id="clientDetailBox"></div></section>
<section id="assets" class="view"><button class="btn secondary back" onclick="openView('home')">← Inicio</button><div class="card"><div class="section">Equipos instalados</div><div id="assetList" class="list"></div></div></section>
<section id="asset" class="view"><button class="btn secondary back" onclick="openView('assets')">← Equipos</button><div class="card"><div class="section">Registrar equipo</div><div class="grid"><div class="field full"><label>Cliente</label><select id="ac"></select></div><div class="field"><label>Tipo</label><select id="at"><option>Motor corredizo</option><option>Motor batiente</option><option>Motor levadizo</option><option>Cortina enrollable</option><option>Barrera</option><option>Techo corredizo</option></select></div><div class="field"><label>Marca / modelo</label><input id="am" placeholder="BFT Deimos BT A600"></div><div class="field"><label>Número de serie</label><input id="as"></div><div class="field"><label>Fecha instalación</label><input id="ad" type="date"></div><div class="field full"><label>Datos técnicos</label><textarea id="an" placeholder="Peso, ancho, voltaje, accesorios, observaciones..."></textarea></div></div><div style="height:10px"></div><button class="btn primary" style="width:100%" onclick="saveAsset()">Guardar equipo</button></div></section>
<section id="assetDetail" class="view"><button class="btn secondary back" onclick="openView('assets')">← Equipos</button><div id="assetDetailBox"></div></section>
<section id="jobs" class="view"><button class="btn secondary back" onclick="openView('home')">← Inicio</button><div class="card"><div class="section">Servicios</div><div id="jobList" class="list"></div></div></section>
<section id="job" class="view"><button class="btn secondary back" onclick="openView('jobs')">← Servicios</button><div class="card"><div class="section">Nuevo servicio</div><div class="grid"><div class="field full"><label>Equipo</label><select id="jc"></select></div><div class="field"><label>Tipo</label><select id="jt"><option>Mantenimiento</option><option>Reparación</option><option>Instalación</option><option>Diagnóstico</option></select></div><div class="field"><label>Estado</label><select id="js"><option>En ejecución</option><option>Pendiente</option><option>Finalizado</option></select></div></div></div><div class="card"><div class="section">Checklist técnico</div><div id="checks"></div></div><div class="card"><div class="section">Evidencia</div><label class="photo">📷 Agregar fotos antes / después<input id="photos" type="file" accept="image/*" multiple></label><div id="photoInfo" class="notice" style="margin-top:7px"></div><div style="height:8px"></div><textarea id="jo" placeholder="Diagnóstico, trabajo realizado, recomendaciones..."></textarea></div><button class="btn primary" style="width:100%;margin-bottom:10px" onclick="saveJob()">Cerrar y guardar servicio</button></section>
<section id="history" class="view"><button class="btn secondary back" onclick="openView('home')">← Inicio</button><div class="card"><div class="section">Historial técnico</div><div id="historyList" class="list"></div></div></section>
</main></div>
<nav class="bottom"><div class="nav"><button onclick="openView('home',this)">⌂<br>Inicio</button><button onclick="openView('clients',this)">👤<br>Clientes</button><button onclick="openView('assets',this)">⚙<br>Equipos</button><button onclick="openView('jobs',this)">🔧<br>Servicios</button></div></nav>
<script>
const KEY='arpa_nextgen_demo_v3';
const empty={clients:[],assets:[],jobs:[]};
function db(){try{return JSON.parse(localStorage.getItem(KEY)||JSON.stringify(empty))}catch{return JSON.parse(JSON.stringify(empty))}}
function saveDb(d){localStorage.setItem(KEY,JSON.stringify(d));document.getElementById('status').textContent='● LAB · guardado local';render()}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clientName(id){const x=db().clients.find(c=>c.id===id);return x?x.name:'Cliente desconocido'}
function assetName(id){const x=db().assets.find(a=>a.id===id);return x?(x.model||x.type):'Equipo desconocido'}
function openView(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='clients')renderClients();if(id==='clientDetail')renderClientDetail();if(id==='asset')refreshSelectors();if(id==='job')refreshJob();if(id==='assetDetail')renderAssetDetail();if(id==='history')renderHistory();document.getElementById('pageTitle').textContent={home:'¿Qué necesitas hacer?',clients:'Clientes',client:'Nuevo cliente',clientDetail:'Ficha del cliente',assets:'Equipos instalados',asset:'Registrar equipo',assetDetail:'Ficha del equipo',jobs:'Servicios',job:'Nuevo servicio',history:'Historial técnico'}[id]||'ARPA Suite NEXT';window.scrollTo({top:0,behavior:'smooth'})}
function render(){const d=db();document.getElementById('mClients').textContent=d.clients.length;document.getElementById('mAssets').textContent=d.assets.length;document.getElementById('mJobs').textContent=d.jobs.length;document.getElementById('recent').innerHTML=d.jobs.length?[...d.jobs].reverse().slice(0,3).map(j=>`<div class="item"><strong>${esc(j.type)} · ${esc(assetName(j.assetId))}</strong><small>${esc(clientName(j.clientId))} · ${new Date(j.createdAt).toLocaleDateString('es-CO')}</small></div>`).join(''):'<div class="empty">Aún no hay actividad. Empieza creando un cliente.</div>';document.getElementById('assetList').innerHTML=d.assets.length?d.assets.map(a=>`<div class="item" onclick="openAsset('${a.id}')"><strong>${esc(a.model||a.type)}</strong><small>${esc(clientName(a.clientId))} · ${esc(a.type)}</small><div class="chips"><span class="chip">${esc(a.serial||'Sin serie')}</span><span class="chip good">Activo</span></div></div>`).join(''):'<div class="empty">Registra el primer equipo instalado.</div>';document.getElementById('jobList').innerHTML=d.jobs.length?[...d.jobs].reverse().map(j=>`<div class="item"><strong>${esc(j.type)} · ${esc(assetName(j.assetId))}</strong><small>${esc(clientName(j.clientId))} · ${new Date(j.createdAt).toLocaleString('es-CO')}</small><div class="chips"><span class="chip good">${j.checks.filter(Boolean).length}/${j.checks.length} checklist</span><span class="chip">${esc(j.status)}</span>${j.photoCount?`<span class="chip">📷 ${j.photoCount}</span>`:''}</div></div>`).join(''):'<div class="empty">No hay servicios registrados.</div>';renderClients();renderHistory()}
function renderClients(){const d=db(),q=(document.getElementById('clientSearch')?.value||'').toLowerCase();const list=d.clients.filter(c=>(c.name+' '+c.phone+' '+c.city).toLowerCase().includes(q));document.getElementById('clientList').innerHTML=list.length?list.map(c=>{const n=d.assets.filter(a=>a.clientId===c.id).length;return `<div class="item" onclick="openClient('${c.id}')"><strong>${esc(c.name)}</strong><small>${esc(c.phone||'Sin teléfono')} · ${esc(c.city||'')}</small><div class="chips"><span class="chip">${n} equipo${n===1?'':'s'}</span></div></div>`}).join(''):'<div class="empty">No hay clientes que coincidan.</div>'}
function renderClientDetail(){const d=db(),c=d.clients.find(x=>x.id===window.selectedClient);if(!c)return;const assets=d.assets.filter(a=>a.clientId===c.id);document.getElementById('clientDetailBox').innerHTML=`<div class="card"><div class="section">Cliente</div><h2 style="margin:0 0 5px">${esc(c.name)}</h2><div class="notice">${esc(c.phone||'Sin teléfono')} · ${esc(c.city||'')}<br>${esc(c.address||'Sin dirección')}</div></div><div class="card"><div class="section">Equipos instalados</div>${assets.length?assets.map(a=>`<div class="item" onclick="openAsset('${a.id}')"><strong>${esc(a.model||a.type)}</strong><small>${esc(a.type)} · ${esc(a.serial||'Sin serie')}</small></div>`).join(''):'<div class="empty">Este cliente todavía no tiene equipos.</div>'}</div><div class="actions"><button class="btn secondary" onclick="openView('asset')">+ Equipo</button>${c.phone?`<button class="btn primary" onclick="window.open('https://wa.me/${c.phone.replace(/\D/g,'')}','_blank')">WhatsApp</button>`:''}</div>`}
function refreshSelectors(){const d=db();document.getElementById('ac').innerHTML=d.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')||'<option value="">Primero crea un cliente</option>'}
function refreshJob(){const d=db();document.getElementById('jc').innerHTML=d.assets.map(a=>`<option value="${a.id}">${esc(a.model||a.type)} — ${esc(clientName(a.clientId))}</option>`).join('')||'<option value="">Primero registra un equipo</option>';const labels=['Estado mecánico y fijaciones','Transmisión / cremallera','Finales de carrera','Fotoceldas y seguridad','Tarjeta electrónica y conexiones','Cableado y alimentación','Controles / accesorios','Lubricación','Prueba apertura y cierre'];document.getElementById('checks').innerHTML=labels.map(x=>`<label class="check"><input type="checkbox"><span>${x}</span></label>`).join('')}
document.getElementById('photos').addEventListener('change',e=>document.getElementById('photoInfo').textContent=e.target.files.length?`${e.target.files.length} foto(s) seleccionada(s). En esta fase se registra la evidencia; la nube se conectará después.`:'')
function saveClient(){const name=document.getElementById('cn').value.trim();if(!name)return alert('Escribe el nombre del cliente.');const d=db();d.clients.push({id:uid('cli'),name,phone:document.getElementById('cp').value.trim(),city:document.getElementById('cc').value.trim(),address:document.getElementById('ca').value.trim(),createdAt:new Date().toISOString()});saveDb(d);['cn','cp','ca'].forEach(id=>document.getElementById(id).value='');openView('clients')}
function saveAsset(){const clientId=document.getElementById('ac').value;if(!clientId)return alert('Primero crea un cliente.');const d=db();d.assets.push({id:uid('eq'),clientId,type:document.getElementById('at').value,model:document.getElementById('am').value.trim(),serial:document.getElementById('as').value.trim(),installDate:document.getElementById('ad').value,notes:document.getElementById('an').value.trim(),createdAt:new Date().toISOString()});saveDb(d);openView('assets')}
function saveJob(){const d=db(),assetId=document.getElementById('jc').value;if(!assetId)return alert('Primero registra un equipo.');const a=d.assets.find(x=>x.id===assetId);const checks=[...document.querySelectorAll('#checks input')].map(x=>x.checked);if(checks.some(x=>!x)&&!confirm('Hay puntos sin marcar. ¿Guardar igualmente?'))return;d.jobs.push({id:uid('job'),assetId,clientId:a.clientId,type:document.getElementById('jt').value,status:document.getElementById('js').value,checks,notes:document.getElementById('jo').value.trim(),photoCount:document.getElementById('photos').files.length,createdAt:new Date().toISOString()});saveDb(d);document.getElementById('jo').value='';document.getElementById('photos').value='';openView('jobs')}
function openClient(id){window.selectedClient=id;openView('clientDetail')}
function openAsset(id){window.selectedAsset=id;openView('assetDetail')}
function renderAssetDetail(){const d=db(),a=d.assets.find(x=>x.id===window.selectedAsset);if(!a)return;const jobs=d.jobs.filter(j=>j.assetId===a.id).reverse();document.getElementById('assetDetailBox').innerHTML=`<div class="card"><div class="section">Equipo</div><h2 style="margin:0 0 4px">${esc(a.model||a.type)}</h2><div class="notice">${esc(clientName(a.clientId))} · ${esc(a.type)}<br>Instalado: ${esc(a.installDate||'Sin fecha')}<br>Serie: ${esc(a.serial||'Sin serie')}</div><div class="chips"><span class="chip good">Activo</span></div></div><div class="card"><div class="section">Datos técnicos</div><div class="notice">${esc(a.notes||'Sin datos técnicos registrados.')}</div></div><div class="card"><div class="section">Historial</div>${jobs.length?jobs.map(j=>`<div class="item"><strong>${esc(j.type)}</strong><small>${new Date(j.createdAt).toLocaleDateString('es-CO')} · ${j.checks.filter(Boolean).length}/${j.checks.length} checklist · ${j.photoCount||0} fotos</small><div class="notice" style="margin-top:6px">${esc(j.notes||'Sin observaciones')}</div></div>`).join(''):'<div class="empty">Todavía no tiene servicios.</div>'}</div><button class="btn primary" style="width:100%" onclick="openView('job')">+ Nuevo servicio para este equipo</button>`}
function renderHistory(){const d=db();document.getElementById('historyList').innerHTML=d.jobs.length?[...d.jobs].reverse().map(j=>`<div class="item"><strong>${esc(j.type)} · ${esc(assetName(j.assetId))}</strong><small>${esc(clientName(j.clientId))} · ${new Date(j.createdAt).toLocaleString('es-CO')}</small><div class="chips"><span class="chip good">${j.checks.filter(Boolean).length}/${j.checks.length} checklist</span><span class="chip">${esc(j.status)}</span></div><div class="notice" style="margin-top:7px">${esc(j.notes||'Sin observaciones')}</div></div>`).join(''):'<div class="empty">El historial aparecerá aquí.</div>'}
render();
</script></body></html>
